<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Project A</title>

  <!-- CSS Style Sheet -->
  <link rel="stylesheet" href="../style/styles.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.js"></script>

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
</head>

<body class="background-gradient">
  <div class="container d-flex align-items-center justify-content-center vh-100">

    <!-- Sign Up Form -->
    <div class="content bg-transparent rounded">
      <div class="container-fluid pt-2 pb-2">

        <!-- Input group -->
        <div class="row m-2">
          <input class="form-control" id="username" placeholder="username">
        </div>
        <div class="row m-2">
          <input class="form-control" id="password" placeholder="password">
        </div>

        <!-- Select account type + invite code-->
        <div class="row m-2">
          <select id="account_type" class="form-select" disabled>
            <option value="user" selected>User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="row m-2">
          <input class="form-control" id="invite_code" placeholder="invite code" disabled>
        </div>

        <!-- Buttons in the form -->
        <!-- TODO: button design -->
        <div class="row m-2">
          <div class="col ps-0 pe-1">
            <button onclick="window.location.href = 'http://127.0.0.1:5000/login.html'" type="button"
              class="btn btn-light w-100">Log In</button>
          </div>
          <div class="col ps-1 pe-0">
            <button id="sign-up-btn" type="button" class="btn btn-success w-100">Sign Up</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Category modal -->
  <div class="modal fade" id="categoryModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark">
          <h5 style="color: #f2f2f2">Categories of interest</h5>
        </div>
        <div class="modal-body">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="arts" id="check0">
            <label class="form-check-label" for="check0">
              Arts
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="biology" id="check1">
            <label class="form-check-label" for="check1">
              Biology
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="business" id="check2">
            <label class="form-check-label" for="check2">
              Business
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="chemistry" id="check3">
            <label class="form-check-label" for="check3">
              Chemistry
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="computer_science" id="check4">
            <label class="form-check-label" for="check4">
              Computer Science
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="literature" id="check5">
            <label class="form-check-label" for="check5">
              Literature
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="mathematics" id="check6">
            <label class="form-check-label" for="check6">
              Mathematics
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="music" id="check7">
            <label class="form-check-label" for="check7">
              Music
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="physics" id="check8">
            <label class="form-check-label" for="check8">
              Physics
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="psychology" id="check9">
            <label class="form-check-label" for="check9">
              Psychology
            </label>
          </div>

        </div>
        <div class="modal-footer bg-dark">
          <button id="submit" type="button" class="btn btn-success">Submit</button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

</body>

<script>
  const dropdown = document.getElementById('account_type')
  const invite_code_field = document.getElementById('invite_code')

  dropdown.addEventListener('input', function () {
    if (dropdown.value == 'admin') {
      invite_code_field.disabled = false;
      invite_code_field.value = "";
    }
    if (dropdown.value == 'user') {
      invite_code_field.disabled = true;
      invite_code_field.value = "";
    }
  });

  async function sha256Hash(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('sign-up-btn').addEventListener('click', function () {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user !== '' && pass !== '') {
        new bootstrap.Modal(document.getElementById('categoryModal')).show();
      }
    });

    document.getElementById('submit').addEventListener('click', async function () {
      const user = document.getElementById('username').value;
      const pass = await sha256Hash(document.getElementById('password').value);
      const account_type = document.getElementById('account_type').value;
      const invite_code = document.getElementById('invite_code').value;

      let categories = "";
      document.querySelectorAll('.form-check-input').forEach(function (checkbox) {
        if (checkbox.checked) {
          categories += checkbox.value + " ";
        }
      });

      const data = {
        "account": {
          "username": user,
          "password": pass,
          "role": account_type
        },
        "categories": categories.trim()
      };

      try {
        const response = await fetch('http://127.0.0.1:5000/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const responseData = await response.json();
        new bootstrap.Modal(document.getElementById('categoryModal')).hide();
        window.location.replace('http://127.0.0.1:5000/login.html');
      } catch (error) {
        console.log(error);
      }
    });
  });
</script>

</html>
