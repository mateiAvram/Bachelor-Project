<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Style Sheet -->
    <link rel="stylesheet" href="../style/styles.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.css" rel="stylesheet">

    <title>Project A</title>
</head>

<body class="background-gradient">

    <div class="container-fluid d-flex flex-column bg-dark">
        <div class="row my-2">
            <div id="brand" class="col d-flex align-items-center">
                <button type="button" class="nav-brand">
                    <img src="../assets/images/icon.png" alt="" width="35" height="35" class="me-2">Project A</button>
                <button id="toggleNav" type="button" class="nav-brand" data-bs-target="#smallNav"
                    aria-controls="smallNav">
                    <img src="../assets/images/menu.png" alt="" width="30" height="30" class="me-2">
                </button>
            </div>
            <div class="collapseNav col-6 justify-content-evenly align-items-center">
                <button id="for-you" type="button" class="nav-btn active"> For You </button>
                <button id="dashboard" type="button" class="nav-btn"> Dashboard </button>
                <button id="courses" type="button" class="nav-btn"> Courses </button>
            </div>
            <div class="collapseNav col-3 justify-content-center align-items-center">
                <div class="dropdown">
                    <button type="button" class="nav-btn dropdown-toggle" id="dropdownMenuLink"
                        data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        User
                    </button>
                    <div class="px-1 dropdown-menu bg-dark" aria-labelledby="dropdownMenuLink">
                        <button type="button" class="nav-btn w-100">
                            Profile
                        </button>
                        <button type="button" class="btn-danger nav-btn w-100">
                            Log Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="smallNav" class="container-fluid flex-column bg-dark p-1" style="display: none;">
        <div>
            <button type="button" class="nav-btn" style="text-align: left; width: 100%;"> For You </button>
        </div>
        <div>
            <button type="button" class="nav-btn" style="text-align: left; width: 100%;"> Dashboard </button>
        </div>
        <div>
            <button type="button" class="nav-btn" style="text-align: left; width: 100%;"> Courses </button>
        </div>
        <button type="button" class="nav-btn" style="text-align: left; width: 100%;">
            Profile
        </button>
        <button type="button" class="nav-btn" style="text-align: left; width: 100%;">
            Log Out
        </button>
    </div>

    <div class="container-fluid flex-grow-1 overflow-hidden">
        <div class="row" style="height: 100%;">
            <div class="col-3 side-content"></div>
            <div id="page" class="col background-white">

                <!-- For you content -->
                <div id="for-you-content" style="display: flex;">

                    <div class="video">
                        <div id="video-placeholder"
                            style="display: flex; width: 100%; height:100%; background-color: black;"></div>
                        <div id="video-player" style="width: 100%; height: 100%;"></div>
                    </div>

                    <div class="options">
                        <button id="sound-btn" class="option-btn">
                            <img id="sound-img" src="../assets/images/mute.png" alt="sound" width="30" height="30">
                        </button>
                        <button id="dislike-btn" type="button" class="option-btn">
                            <img id="dislike-img" src="../assets/images/dislike.png" alt="dislike" width="30"
                                height="30">
                        </button>
                        <button id="like-btn" type="button" class="option-btn">
                            <img id="like-img" src="../assets/images/like.png" alt="like" width="30" height="30">
                        </button>
                    </div>

                </div>

                <!-- Dashboard content -->
                <div id="dashboard-content" style="display: none;"></div>

                <!-- Courses content -->
                <div id="courses-content" style="display: none;"></div>

            </div>
            <div class="col-3 side-content"></div>
        </div>
    </div>


    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>

    <!-- Youtube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Navbar Visibility
        document.getElementById('toggleNav').addEventListener('click', function () {
            var content = document.getElementById('smallNav');
            content.style.display = (content.style.display === 'none') ? 'flex' : 'none';
        });

        // Navigation
        function showContent(activeButtonId, contentId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('[id$="-content"]').forEach(content => content.style.display = 'none');
            document.getElementById(activeButtonId).classList.add('active');
            document.getElementById(contentId).style.display = 'flex';
        }

        document.getElementById('for-you').addEventListener('click', function () {
            showContent('for-you', 'for-you-content');
        });

        document.getElementById('dashboard').addEventListener('click', function () {
            showContent('dashboard', 'dashboard-content');
        });

        document.getElementById('courses').addEventListener('click', function () {
            showContent('courses', 'courses-content');
        });

        // YouTube Player
        var player;
        var videoList = [];
        var watched_videos = [];
        var currentIndex = 0;

        var recorded = false;
        var start_time = 0;
        var duration_ms = 0;
        var action_type = '';

        // Fetch video list from server
        fetch('http://127.0.0.1:5000/request_videos')
            .then(response => response.json())
            .then(data => {
                if (data.videos.length > 0) {
                    document.getElementById('video-placeholder').style.display = 'none'
                    videoList = data.videos.map(video => video.video_id);
                    if (typeof YT !== 'undefined' && YT && YT.Player) {
                        onYouTubeIframeAPIReady();
                    }
                }
            })
            .catch(error => console.log('Error fetching video list:', error));

        function loadVideo(videoId) {
            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('video-player', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'mute': 1,
                        'controls': 0,
                        'playlist': videoId
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
            start_time = new Date().getTime();
            duration_ms = 0;
            recorded = false;
            action_type = '';
            update_buttons();
        }

        function onYouTubeIframeAPIReady() {
            if (videoList.length > 0) {
                loadVideo(videoList[currentIndex]);
            }
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                console.log('player ended');
                if (!recorded && !watched_videos.includes(videoList[currentIndex])) {
                    end_time = new Date().getTime();
                    duration_ms += end_time - start_time;
                    recorded = true;
                    watched_videos.push(videoList[currentIndex]);
                    record_action();
                }

                player.playVideo(); // Loop the video.
                return
            }

            if (event.data == YT.PlayerState.PAUSED) {
                if (!recorded && !watched_videos.includes(videoList[currentIndex])) {
                    end_time = new Date().getTime();
                    duration_ms += end_time - start_time;
                }
                return
            }

            if (event.data == YT.PlayerState.PLAYING) {
                if (!recorded && !watched_videos.includes(videoList[currentIndex])) {
                    start_time = new Date().getTime();
                }
                return

            }
        }

        // Personal Functions

        async function record_action() {
            data = {
                "video_id": videoList[currentIndex],
                "action_type": action_type,
                "duration": duration_ms
            }

            try {
                const response = await fetch('http://127.0.0.1:5000/user_action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const responseData = await response.json();
                console.log(response);
            } catch (error) {
                console.log(error);
            }
        }

        function update_buttons() {
            var img_like = document.getElementById('like-img');
            var img_dislike = document.getElementById('dislike-img');
            if (action_type == '') {
                img_like.src = '../assets/images/like.png'
                img_dislike.src = '../assets/images/dislike.png'
            } else if (action_type == 'like') {
                img_like.src = '../assets/images/liked.png'
                img_dislike.src = '../assets/images/dislike.png'
            } else if (action_type == 'dislike') {
                img_like.src = '../assets/images/like.png'
                img_dislike.src = '../assets/images/disliked.png'
            }
        }

        function upFunction() {
            if (currentIndex > 0) {
                currentIndex--;
                loadVideo(videoList[currentIndex])
            }
        }

        async function downFunction() {

            if (!recorded && !watched_videos.includes(videoList[currentIndex])) {
                end_time = new Date().getTime();
                duration_ms += end_time - start_time;
                recorded = true;
                watched_videos.push(videoList[currentIndex]);
                record_action();
            }

            if (videoList.length - currentIndex <= 3) {
                fetch('http://127.0.0.1:5000/request_videos')
                    .then(response => response.json())
                    .then(data => {
                        newVideos = data.videos.map(video => video.video_id);
                        videoList.concat(newVideos)
                    })
                    .catch(error => console.log('Error fetching video list:', error));

            }
            currentIndex++;
            loadVideo(videoList[currentIndex]);

        }

        function handleKeyDown(event) {
            if (event.keyCode == 38) {
                upFunction();
            } else if (event.keyCode == 40) {
                downFunction();
            }
        }

        document.addEventListener('keydown', handleKeyDown);

        document.getElementById('sound-btn').addEventListener('click', function () {
            var img = document.getElementById('sound-img');
            if (player.isMuted()) {
                img.src = '../assets/images/sound.png';
                player.unMute();
            } else {
                img.src = '../assets/images/mute.png';
                player.mute();
            }
        });

        document.getElementById('like-btn').addEventListener('click', function () {
            if (action_type == 'like') {
                action_type = '';
            } else {
                action_type = 'like';
            }
            update_buttons();
        });
        document.getElementById('dislike-btn').addEventListener('click', function () {
            if (action_type == 'dislike') {
                action_type = '';
            } else {
                action_type = 'dislike';
            }
            update_buttons();
        });

    </script>

</body>

</html>
