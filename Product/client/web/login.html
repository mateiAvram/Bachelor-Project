<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Project A</title>

  <!-- CSS Style Sheet -->
  <link rel="stylesheet" href="../style/styles.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.js"></script>

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
</head>

<body class="background-gradient">
  <div class="container d-flex align-items-center justify-content-center vh-100">

    <!-- Log In Form -->
    <div class="content bg-transparent rounded">
      <div class="container-fluid pt-2 pb-2">
        <div class="row m-2">
          <input class="form-control" id="username" placeholder="username">
        </div>
        <div class="row m-2">
          <input class="form-control" id="password" placeholder="password">
        </div>

        <!-- Buttons in the form -->
        <!-- TODO: button design -->
        <div class="row m-2">
          <div class="col ps-0 pe-1">
            <button id="log-in-btn" type="button" class="btn btn-success w-100">Log In</button>
          </div>
          <div class="col ps-1 pe-0">
            <button onclick="window.location.href = 'http://127.0.0.1:5000/signup.html'" type="button"
              class="btn btn-light w-100">Sign Up</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<script>
  async function sha256Hash(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
  }

  document.getElementById('log-in-btn').addEventListener('click', async function () {
    const user = document.getElementById('username').value;
    const pass = await sha256Hash(document.getElementById('password').value);

    const data = {
      "username": user,
      "password": pass
    };

    try {
      const response = await fetch('http://127.0.0.1:5000/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data),
        credentials: 'include'
      });

      if (!response.ok) {
        throw new Error('Network response was not ok');
      }

      const responseData = await response.json();
      window.location.replace('http://127.0.0.1:5000/');
      console.log(response)
    } catch (error) {
      console.log(error);
    }
  });
</script>


</html>
